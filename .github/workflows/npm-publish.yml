# NPM Publish Workflow
# Publishes ctxman to npm when a Release is created.
#
# Uses npm **Trusted Publishing (OIDC)** — no NPM_TOKEN secret. GitHub Actions
# proves this workflow's identity to npm with a short-lived OIDC token and npm
# attaches build provenance automatically.
#
# One-time setup on npmjs.com (the package already exists):
#   Package ctxman → Settings → Trusted Publisher →
#   GitHub Actions:  user hakkisagdic · repository ctxman ·
#   workflow filename npm-publish.yml

name: NPM Publish

on:
  release:
    types: [created]
  push:
    tags: ['v*']
  workflow_dispatch:

# Concurrency: prevent duplicate publishes
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      # OIDC publishing needs npm >= 11.5.1; the runner's bundled npm is older
      - name: Install npm latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "ctxman@$VERSION" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ctxman@$VERSION is already on the registry; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "ctxman@$VERSION is not on the registry yet"
          fi

      # No NODE_AUTH_TOKEN — authentication happens via OIDC
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public

      - name: Verify published version
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "ctxman@$VERSION is live on the npm registry"
          npm view ctxman@$VERSION
