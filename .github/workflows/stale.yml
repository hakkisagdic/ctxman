# Stale Issues and PRs Management
# Automatically marks and closes inactive issues and PRs

name: Stale

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    name: Mark Stale
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,help wanted,in progress'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had any activity for 60 days.

            If this issue is still relevant:
            - Add a comment describing the current status
            - Remove the `stale` label

            This issue will be automatically closed in 14 days if no further activity occurs.

          close-issue-message: |
            This issue has been automatically closed due to inactivity.

            If you believe this issue is still relevant:
            - Reopen the issue
            - Provide updated context

            Thank you for your contributions!

          # PR settings
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,work in progress,in progress'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had any activity for 30 days.

            If this PR is still being worked on:
            - Push new commits or add a comment with an update
            - Remove the `stale` label

            This PR will be automatically closed in 7 days if no further activity occurs.

          close-pr-message: |
            This pull request has been automatically closed due to inactivity.

            If you would like to continue this work:
            - Reopen the PR
            - Ensure it is up to date with the main branch

            Thank you for your contributions!

          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
          delete-branch: false
          include-only-assigned: false
