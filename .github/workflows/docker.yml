# Docker Image Workflow
# Builds the ctxman image (Dockerfile) and smoke-tests it (scripts/docker-smoke-test.sh).
#
#   pull requests        build and test only, nothing is pushed
#   version tags (v*)    build, test, then push to ghcr.io/<owner>/<repo> for linux/amd64
#                        and linux/arm64, tagged X.Y.Z, X.Y, X and latest
#
# The tag push that publishes to npm (npm-publish.yml) and creates the GitHub Release
# (release.yml) also publishes the image; see release.yml for how to cut a release.

name: Docker

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'index.js'
      - 'index.d.ts'
      - 'ctxman.js'
      - 'bin/**'
      - 'lib/**'
      - '.ctxman/**'
      - 'scripts/docker-smoke-test.sh'
      - '.github/workflows/docker.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

# Concurrency: cancel superseded PR builds, never a publish
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TEST_TAG: ctxman:test

jobs:
  # Pull requests and manual runs: build and smoke-test, no registry access
  build:
    name: Build & Test Image
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/docker-smoke-test.sh "$TEST_TAG"

  # Version tags: test the amd64 image, then push both platforms to GHCR
  publish:
    name: Publish Image to GHCR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/docker-smoke-test.sh "$TEST_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only for releases, not for prereleases (v3.1.0-beta.1)
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
