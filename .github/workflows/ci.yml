# CI Workflow for ctxman
# Implements best practices: concurrency groups, timeouts, proper permissions,
# matrix strategy, cache optimization, and artifact retention

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Concurrency: cancel in-progress runs for same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege permissions
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  # Security audit job - runs first and fails fast on vulnerabilities
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
        # Don't fail CI on audit - handled by Dependabot

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
          retention-days: 30
          if-no-files-found: ignore

  # Lint job - fast feedback
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # Main test job with coverage and matrix strategy
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [security-audit, lint]
    strategy:
      # Let every Node line finish so a failure on one is not masked by a cancel
      fail-fast: false
      matrix:
        # Minimum supported (package.json engines) and the current Active LTS
        node-version: [22.x, 24.x]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run tests
        run: npm test
        timeout-minutes: 25
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '22.x' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node${{ matrix.node-version }}-${{ matrix.os }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # CodeQL analysis job (security scanning)
  # Note: This runs CodeQL as part of CI for fast feedback
  # The standalone codeql.yml runs on schedule and main branch pushes
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-audit
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript'

  # Summary job for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test, codeql]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          for job in lint test codeql; do
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              codeql) result="${{ needs.codeql.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "::error::CI job '$job' did not succeed (result: $result)"
              failed=1
            fi
          done
          if [[ -n "$failed" ]]; then
            exit 1
          fi
          echo "All CI checks passed!"
