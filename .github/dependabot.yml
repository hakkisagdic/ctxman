# Dependabot configuration for automated dependency updates
# Keeps dependencies up-to-date and secure
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

registries:
  npm-registry:
    type: npm-registry
    url: https://registry.npmjs.org

updates:
  # npm dependencies - Main package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    # Limit open PRs to avoid overwhelming maintainers
    open-pull-requests-limit: 10
    # Target production dependencies first
    target-branch: main
    # Group minor and patch updates together for cleaner history
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
    # Add labels to PRs
    labels:
      - dependencies
      - automated
    # Commit message configuration (semantic commits)
    commit-message:
      prefix: deps
      include: scope
    # Reviewers for dependency updates
    reviewers:
      - hakkisagdic
    # PR branch naming
    branch-name-separator: '-'
    # Ignore specific packages that need manual updates
    ignore:
      # Express 5.x is intentional (modern features)
      - dependency-name: express
        update-types: [version-update:semver-major]
      # React 19 is intentional
      - dependency-name: react
        update-types: [version-update:semver-major]
      # Zod 4 is intentional
      - dependency-name: zod
        update-types: [version-update:semver-major]

  # Desktop app dependencies (Electron + Vue)
  - package-ecosystem: npm
    directory: /desktop-app
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      desktop-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - desktop
      - automated
    commit-message:
      prefix: deps(desktop)
      include: scope
    reviewers:
      - hakkisagdic
    ignore:
      # Electron updates require careful testing
      - dependency-name: electron
        update-types: [version-update:semver-major]

  # Documentation website (VitePress)
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: thursday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      website-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - documentation
      - automated
    commit-message:
      prefix: deps(website)
      include: scope
    reviewers:
      - hakkisagdic

  # VS Code extension
  - package-ecosystem: npm
    directory: /ide/vscode
    schedule:
      interval: weekly
      day: friday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      vscode-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: deps(vscode)
      include: scope
    reviewers:
      - hakkisagdic
    ignore:
      # @types/vscode pins the minimum supported VS Code version
      - dependency-name: '@types/vscode'
        update-types: [version-update:semver-major]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - github-actions
      - dependencies
      - automated
      - ci-cd
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions-updates:
        patterns:
          - '*'
    reviewers:
      - hakkisagdic
