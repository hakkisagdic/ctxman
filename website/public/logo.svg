<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient)"/>
  
  <!-- Text "C" stylized -->
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white">C</text>
  
  <!-- Code brackets decoration -->
  <text x="140" y="175" font-family="monospace" font-size="60" fill="rgba(255,255,255,0.8)">{}</text>
  
  <!-- Small dots representing tokens/files -->
  <circle cx="60" cy="60" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="196" cy="60" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="60" cy="196" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="196" cy="196" r="8" fill="rgba(255,255,255,0.6)"/>
</svg>
